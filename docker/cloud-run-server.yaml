# Cloud Run service — Open-Trainer web/subscription API + landing page.
# Deploy: gcloud run services replace docker/cloud-run-server.yaml --region $REGION
# Stateless and scales to zero. Replace PROJECT_ID / REGION / IMAGE / URLs.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: open-trainer-web
  labels:
    app: open-trainer
    component: web
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/open-trainer/web:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: OPEN_TRAINER_PUBLIC_URL
              value: "https://open-trainer.app"
            - name: TELEGRAM_BOT_USERNAME
              value: "OpenTrainerBot"
            - name: SUPABASE_URL
              value: "https://lhquhastwnurmvyrzdeh.supabase.co"
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: stripe-secret-key, key: latest }
            - name: STRIPE_PRICE_ID
              valueFrom:
                secretKeyRef: { name: stripe-price-id, key: latest }
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef: { name: stripe-webhook-secret, key: latest }
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef: { name: supabase-service-role-key, key: latest }
